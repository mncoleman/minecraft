name: ClaudeBuild
version: 0.2.0
author: mncoleman
description: Loopback build API for Claude (scan, batched place, undo) and a Mannequin Claude avatar. Paper 26.2.
main: com.mncoleman.mc.build.ClaudeBuildPlugin
api-version: '26.2'
softdepend: [BlueMap]
commands:
  claudebuild:
    description: "Claude admin: /claude avatar <on|off|test> | status | cancel"
    aliases: [claude]
    usage: "/claude avatar <on|off|test> | status | cancel"
    permission: claudebuild.admin
  hud:
    description: "Show or hide the coordinates and time HUD at the top of the screen"
    usage: "/hud"
permissions:
  claudebuild.admin:
    default: op
