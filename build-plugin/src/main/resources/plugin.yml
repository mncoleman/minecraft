name: ClaudeBuild
version: 0.1.0
author: mncoleman
description: Loopback build API for Claude (scan, batched place, undo) and a packet-only Claude avatar.
main: com.mncoleman.mc.build.ClaudeBuildPlugin
commands:
  claudebuild:
    description: "Claude admin: /claude avatar <on|off|test> | status | cancel"
    aliases: [claude]
    usage: "/claude avatar <on|off|test> | status | cancel"
    permission: claudebuild.admin
permissions:
  claudebuild.admin:
    default: op
