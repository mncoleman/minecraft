# Second game server: modern Minecraft 26.x for the "26" Eaglercraft client.
#
# Runs side by side with the 1.8 stack (server/ → mc-eagler) and shares NOTHING
# with it: own container, own ./data (worlds, plugins, configs), own loopback
# port. It is a SEPARATE compose project on purpose — editing or `up`-ing this
# file can never recreate mc-eagler.
#
# Same crash-isolation contract as server/docker-compose.yml: hard mem/cpu caps,
# loopback-only publish, Caddy is the only way in (wss://…/26 → 127.0.0.1:25570).
#
# Backend = Paper 26.3 (protocol 777) on Java 25 — the same protocol the 26.x
# Eaglercraft client speaks, so no Via translation happens for it (on 26.2 every
# packet was down-translated). EaglerXPaper (a fork of EaglerXServer that keeps
# the EaglercraftXServer plugin name + API) adds the browser WebSocket protocol;
# ViaVersion/ViaBackwards are still required by EaglerXPaper. The same EaglerJwtAuth jar as the 1.8 server
# gates logins.
#
# It joins the 1.8 project's network (server_default) as an external network so
# mc-auth can reach it by name (RCON, presence, ClaudeBuild API) exactly like it
# reaches mc-eagler.

services:
  minecraft26:
    image: itzg/minecraft-server:java25
    container_name: mc-eagler26
    restart: unless-stopped
    tty: true
    stdin_open: true

    # MC_JWT_SECRET + MC_PRESENCE_TOKEN must equal mc-auth's (same values as
    # server/.env). RCON_PASSWORD is this server's own (mc-auth: RCON26_PASSWORD).
    env_file:
      - .env

    # --- HARD resource caps (crash isolation) -------------------------------
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 2.0
    # ------------------------------------------------------------------------

    ports:
      - "127.0.0.1:25570:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      PAPER_BUILD: "249"
      UID: "1001"
      GID: "1001"
      ENABLE_RCON: "true"
      MEMORY: "3G"
      USE_AIKAR_FLAGS: "true"
      MAX_PLAYERS: "20"
      MODE: "creative"
      OPS: "Matthew"
      DIFFICULTY: "normal"
      MOTD: "mncoleman private server (26)"
      ONLINE_MODE: "FALSE"      # identity is enforced by the JWT plugin
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      SPAWN_PROTECTION: "0"
      # Browser clients: every chunk is sent over the WebSocket and meshed in
      # WASM. 6 sends ~44% fewer chunks than 8 (13x13 vs 17x17); simulation 4
      # keeps ticking cheap. Raise VIEW_DISTANCE if players want a longer view.
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "4"
      SYNC_CHUNK_WRITES: "false"
      TZ: "UTC"

    volumes:
      - ./data:/data

    networks:
      - server_default

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 3m
      interval: 30s
      retries: 5

    stop_grace_period: 60s

networks:
  server_default:
    external: true
