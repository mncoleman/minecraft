# Second game server: modern Minecraft 26.x for the "26" Eaglercraft client.
#
# Runs side by side with the 1.8 stack (server/ → mc-eagler) and shares NOTHING
# with it: own container, own ./data (worlds, plugins, configs), own loopback
# port. It is a SEPARATE compose project on purpose — editing or `up`-ing this
# file can never recreate mc-eagler.
#
# Same crash-isolation contract as server/docker-compose.yml: hard mem/cpu caps,
# loopback-only publish, Caddy is the only way in (wss://…/26 → 127.0.0.1:25570).
#
# Backend = Paper 26.3 (protocol 777) on Java 25 — the same protocol the 26.x
# Eaglercraft client speaks, so no Via translation happens for it (on 26.2 every
# packet was down-translated). EaglerXPaper (a fork of EaglerXServer that keeps
# the EaglercraftXServer plugin name + API) adds the browser WebSocket protocol;
# ViaVersion/ViaBackwards are still required by EaglerXPaper. The same EaglerJwtAuth jar as the 1.8 server
# gates logins.
#
# It joins the 1.8 project's network (server_default) as an external network so
# mc-auth can reach it by name (RCON, presence, ClaudeBuild API) exactly like it
# reaches mc-eagler.

services:
  minecraft26:
    image: itzg/minecraft-server:java25
    container_name: mc-eagler26
    restart: unless-stopped
    tty: true
    stdin_open: true

    # MC_JWT_SECRET + MC_PRESENCE_TOKEN must equal mc-auth's (same values as
    # server/.env). RCON_PASSWORD is this server's own (mc-auth: RCON26_PASSWORD).
    env_file:
      - .env

    # --- HARD resource caps (crash isolation) -------------------------------
    mem_limit: 5g
    memswap_limit: 5g
    cpus: 2.0
    # ------------------------------------------------------------------------

    ports:
      - "127.0.0.1:25570:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      PAPER_BUILD: "249"
      UID: "1001"
      GID: "1001"
      ENABLE_RCON: "true"
      MEMORY: "3G"
      USE_AIKAR_FLAGS: "true"
      # Browser clients in a background tab get throttled to one wake-up a
      # minute (Chrome, after 5 min hidden), so they answer keep-alives late
      # and the default 30 s limit kicked them ("Timed out"). Allow 3 minutes.
      JVM_DD_OPTS: "paper.playerconnection.keepalive=180"
      MAX_PLAYERS: "20"
      MODE: "creative"
      OPS: "3c22628f-78fc-3153-b588-6c5707ba00e8"  # owner's offline-mode UUID; see server/docker-compose.yml
      DIFFICULTY: "normal"
      MOTD: "mncoleman private server (26)"
      ONLINE_MODE: "FALSE"      # identity is enforced by the JWT plugin
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      SPAWN_PROTECTION: "0"
      # Browser clients: every chunk is sent over the WebSocket and meshed in
      # WASM, so view distance costs the browser. It was 6 (13x13 chunks) but
      # looked shorter than 1.8's 8; Matthew chose 10 (21x21) on 2026-11-17,
      # then 16 (33x33) on 2026-11-19 (each player sets their own render
      # distance in-game; this is the server's cap). Simulation 4 keeps
      # ticking cheap.
      VIEW_DISTANCE: "16"
      SIMULATION_DISTANCE: "4"
      SYNC_CHUNK_WRITES: "false"
      # QualityArmory gun pack, sent by the server WITH its SHA-1 so the client
      # caches it (QA itself sends no hash, so it re-downloaded every join; QA's
      # own sending is off: useDefaultResourcepack: false). Update the SHA-1 if
      # clients/26/packs/qualityarmory.zip changes.
      RESOURCE_PACK: "https://minecraft.mncoleman.com/26/packs/qualityarmory.zip"
      RESOURCE_PACK_SHA1: "3a2d248860719674412cf60ae0f2a30de60ddd57"
      RESOURCE_PACK_ENFORCE: "TRUE"   # required (2026-11-21): otherwise others see guns as crossbows
      RESOURCE_PACK_PROMPT: '{"text":"This server needs its gun pack so weapons look right. Click Yes to download it (once)."}'
      TZ: "UTC"

    volumes:
      - ./data:/data

    networks:
      - server_default

    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 3m
      interval: 30s
      retries: 5

    stop_grace_period: 60s

networks:
  server_default:
    external: true
