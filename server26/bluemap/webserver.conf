## BlueMap web server (26). Port 8100 is NOT published by docker-compose: it is
## reachable only on the server_default network, where mc-auth proxies it at
## /map/3d/ behind a panel session. Never publish it.
enabled: true
webroot: "bluemap/web"
port: 8100
sse-enabled: false
additional-headers: {
  "Cache-Control": "private, max-age=60"
  "X-Content-Type-Options": "nosniff"
}
log: {
  append: false
}
