## BlueMap plugin config (26). Player positions stay private: the panel shows
## who is online only to friends and co-members, so no live player markers.
live-player-markers: false
hidden-game-modes: [ "survival", "creative", "adventure", "spectator" ]
hide-vanished: true
hide-invisible: true
hide-sneaking: true
hide-below-sky-light: 0
hide-below-block-light: 0
hide-different-world: true
skin-download: false
player-render-limit: -1
