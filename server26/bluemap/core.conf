## BlueMap core config for the 26 server (Map tab). Copied to data/plugins/BlueMap/ by deploy.
# accept-download: TRUE means the server owner has accepted Mojang's EULA
# (https://account.mojang.com/documents/minecraft_eula), owns a Minecraft Java licence,
# and lets BlueMap download Mojang's client jar from piston-meta.mojang.com to texture the map.
# Only the owner may flip this.
accept-download: false
data: "bluemap"
# The game shares 2 CPUs with players: one low-priority render thread.
render-thread-count: 1
render-thread-priority: 1
update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5
scan-for-mod-resources: false
metrics: false
log: {
  append: false
}
